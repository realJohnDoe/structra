[project]
name = "structra-parsers"
version = "0.1.0"
description = "Structra Parsers: turn a git checkout into a Graph File."
requires-python = "==3.13.*"
license = "MIT"
dependencies = []

[project.scripts]
structra-parse-python = "structra_parsers.python:main"

[dependency-groups]
dev = ["pytest", "grimp", "jsonschema"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/structra_parsers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
