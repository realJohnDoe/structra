# Relative and absolute imports across packages: a src/ layout, a test
# directory without __init__.py, a stub next to its module, a stub-only module,
# conditional and function-local imports, and imports that don't resolve.
origin = "https://github.com/example/packages"
stderr = [
  "3 unresolved internal-looking imports",
  "  ....too_far (1)",
  "  .nothing (1)",
  "  tests.nothing (1)",
]

