name: Pages

# Production deploy to gh-pages and per-PR previews (labelled `preview`) under
# pr-preview/pr-<N>/. The build lives here; the shared workflow does the deploy,
# the preview and its removal. e2e.yml runs by itself on PRs, so it is called
# here only for pushes, where it gates production.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled, unlabeled, closed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/e2e.yml

  build:
    needs: e2e
    if: >-
      !cancelled() && (needs.e2e.result == 'success' || needs.e2e.result == 'skipped') &&
      github.event.action != 'closed' && github.event.action != 'unlabeled' &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
        env:
          BASE_PATH: ${{ github.event_name == 'pull_request' && format('/{0}/pr-preview/pr-{1}/', github.event.repository.name, github.event.number) || format('/{0}/', github.event.repository.name) }}
      - uses: actions/upload-artifact@v7
        with: { name: site, path: dist, include-hidden-files: true }

  pages:
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    uses: realJohnDoe/joes-workshop/.github/workflows/pages.yml@main
    with: { artifact: site }
    permissions: { contents: write, pull-requests: write }
