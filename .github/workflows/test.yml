name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # The Python-hosted Parsers' conformance fixtures (Python and Rust) and the
  # grimp oracle. No path filter: the suite is fast. The runner has cargo, so
  # the Rust fixtures run both with and without it. #42 absorbs this job.
  parsers:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parsers/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: parsers/python/uv.lock
      - run: cargo --version
      - run: uv sync --frozen
      - run: uv run --frozen pytest -q
