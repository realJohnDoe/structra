name: PR preview

# Builds every PR with the preview base path, so the build is checked whether
# or not the PR gets a preview. Only the deploy step is gated on the `preview`
# label. Don't make this a required check. Previews serve once Pages is set to
# deploy from the gh-pages branch.
on:
  pull_request:
    types: [opened, reopened, synchronize, labeled, closed]

permissions:
  contents: write
  pull-requests: write

# Its own group per PR, so it never cancels or is cancelled by a production deploy.
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    # `labeled` fires for every label; only `preview` should rebuild.
    if: github.event.action != 'labeled' || github.event.label.name == 'preview'
    runs-on: ubuntu-latest
    steps:
      # No `if:` here: the action's cleanup on `closed` needs a git checkout.
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: github.event.action != 'closed'
      - uses: actions/setup-node@v7
        if: github.event.action != 'closed'
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: github.event.action != 'closed'
      - run: pnpm run build
        if: github.event.action != 'closed'
        env:
          BASE_PATH: /structra/pr-preview/pr-${{ github.event.number }}/
      # Forks can't push. On `closed` this runs only the action's cleanup.
      - uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        if: >-
          github.event.pull_request.head.repo.full_name == github.repository &&
          (github.event.action == 'closed' ||
          contains(github.event.pull_request.labels.*.name, 'preview'))
        with:
          source-dir: dist
