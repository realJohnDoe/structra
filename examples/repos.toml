# Example Repos: well-known repositories pinned at a release commit, each
# shipped with a precomputed Graph File (examples/<name>.graph.json) and
# dendrogram. See GLOSSARY.md ("Example Repo", "Example Repo List") and
# "Example repo list, pinned commits, C/Linux feasibility" (#12).
#
# - `commit` (full SHA) is the pin. `release` is only a readable label, since
#   tags can move.
# - A pin changes only on purpose, in its own PR that also regenerates that
#   repo's Graph File and dendrogram.
# - `exclude` (git pathspec-style globs, passed as --exclude) is only for
#   vendored code the Parser's default rule misses. Tests and fixtures stay in.
# - One Graph File per repo, in its headline language.
# - The first entry is the one the app shows on first load.

# --- Python ---

[[repo]]
name = "flask"
url = "https://github.com/pallets/flask"
language = "python"
release = "3.1.3"
commit = "22d924701a6ae2e4cd01e9a15bbaf3946094af65"
exclude = []

[[repo]]
name = "requests"
url = "https://github.com/psf/requests"
language = "python"
release = "v2.34.2"
commit = "6e83187b8feb273ed4c6cdab5efd8d54901dfab3"
exclude = []

